<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comic Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{background:#1d1d1d;padding:10px;position:sticky;top:0;z-index:5}
h2{margin:0 0 8px;font-size:19px}
button,input,select{font:inherit}
button{background:#333;color:white;border:1px solid #555;border-radius:7px;padding:8px;margin:2px}
button:active{transform:scale(.96)}
#pages{display:flex;gap:5px;overflow:auto;padding:7px;background:#151515}
main{padding:10px;display:flex;justify-content:center}
#stage{width:min(96vw,900px);aspect-ratio:3/2;background:white;position:relative;overflow:hidden;border:3px solid #555;touch-action:none}
.panel{position:absolute;border:3px solid #111;background:#eee}
.obj{position:absolute;min-width:45px;min-height:30px;padding:7px;user-select:none;touch-action:none}
.bubble{background:white;color:#111;border:2px solid #111;border-radius:50%;text-align:center;padding:12px}
.thought{border-radius:45%}
.caption{background:#ffe66d;color:#111;border:2px solid #111;font-weight:bold}
.sticker{font-size:42px;background:transparent}
img.obj{padding:0;object-fit:contain}
#help{color:#aaa;font-size:12px;padding:8px;text-align:center}
</style>
</head>

<body>

<header>
<h2>🎨 Comic Studio</h2>

<button onclick="addPage()">＋ Page</button>
<button onclick="addPanel()">＋ Panel</button>
<button onclick="speech()">💬 Speech</button>
<button onclick="thought()">💭 Thought</button>
<button onclick="caption()">📝 Caption</button>
<button onclick="sticker()">⭐ Sticker</button>
<button onclick="imagePick()">🖼️ Image</button>
<button onclick="save()">💾 Save</button>
<button onclick="load()">📂 Load</button>
<button onclick="exportPNG()">⬇️ Export</button>
<button onclick="clearPage()">🗑️ Clear</button>

<input id="file" type="file" accept="image/*" hidden onchange="addImage(event)">
</header>

<div id="pages"></div>

<main>
<div id="stage"></div>
</main>

<div id="help">
Drag objects with your finger. Double-tap text to edit it.
Your project is saved only on this device.
</div>

<script>

let project={
 pages:[
  {
   bg:"#ffffff",
   panels:[],
   objects:[]
  }
 ],
 current:0
};

let drag=null;

const stage=document.getElementById("stage");
const pages=document.getElementById("pages");

function currentPage(){
 return project.pages[project.current];
}

function render(){

 pages.innerHTML="";

 project.pages.forEach((p,i)=>{

  let b=document.createElement("button");

  b.textContent="Page "+(i+1);

  if(i===project.current)
   b.style.outline="2px solid white";

  b.onclick=()=>{
   project.current=i;
   render();
  };

  pages.appendChild(b);

 });

 stage.innerHTML="";

 let p=currentPage();

 stage.style.background=p.bg;

 p.panels.forEach(x=>{

  let el=document.createElement("div");

  el.className="panel";

  el.style.left=x.x+"%";
  el.style.top=x.y+"%";
  el.style.width=x.w+"%";
  el.style.height=x.h+"%";

  stage.appendChild(el);

 });

 p.objects.forEach((x,i)=>makeObject(x,i));

}

function makeObject(x,i){

 let el;

 if(x.type==="image"){

  el=document.createElement("img");
  el.src=x.src;
  el.className="obj";

 }else{

  el=document.createElement("div");

  el.className="obj";

  if(x.type==="speech")
   el.className+=" bubble";

  if(x.type==="thought")
   el.className+=" bubble thought";

  if(x.type==="caption")
   el.className+=" caption";

  if(x.type==="sticker")
   el.className+=" sticker";

  el.textContent=x.text;

 }

 el.style.left=x.x+"%";
 el.style.top=x.y+"%";
 el.style.width=x.w+"%";
 el.style.height=x.h+"%";

 el.style.transform=
   "rotate("+x.r+"deg) scale("+x.s+")";

 el.ondblclick=()=>{

  if(x.type==="image") return;

  let text=prompt("Edit text:",x.text);

  if(text!==null){

   x.text=text;
   render();

  }

 };

 el.onpointerdown=(e)=>{

  e.preventDefault();

  drag={
   object:x,
   startX:e.clientX,
   startY:e.clientY,
   oldX:x.x,
   oldY:x.y
  };

 };

 stage.appendChild(el);

}

stage.onpointermove=(e)=>{

 if(!drag)return;

 let r=stage.getBoundingClientRect();

 drag.object.x=
   drag.oldX+
   (e.clientX-drag.startX)/r.width*100;

 drag.object.y=
   drag.oldY+
   (e.clientY-drag.startY)/r.height*100;

 render();

};

stage.onpointerup=()=>{
 drag=null;
};

stage.onpointercancel=()=>{
 drag=null;
};

function addPage(){

 project.pages.push({
  bg:"#ffffff",
  panels:[],
  objects:[]
 });

 project.current=project.pages.length-1;

 render();

}

function addPanel(){

 let p=currentPage();

 let n=p.panels.length;

 let layouts=[

  [0,0,100,100],

  [0,0,50,100],

  [50,0,50,100],

  [0,0,100,50],

  [0,50,100,50],

  [0,0,50,50],

  [50,0,50,50],

  [0,50,50,50],

  [50,50,50,50]

 ];

 let a=layouts[n%layouts.length];

 p.panels.push({
  x:a[0],
  y:a[1],
  w:a[2],
  h:a[3]
 });

 render();

}

function speech(){

 currentPage().objects.push({
  type:"speech",
  text:"Hello!",
  x:15,
  y:15,
  w:28,
  h:18,
  r:0,
  s:1
 });

 render();

}

function thought(){

 currentPage().objects.push({
  type:"thought",
  text:"Hmm...",
  x:15,
  y:15,
  w:28,
  h:18,
  r:0,
  s:1
 });

 render();

}

function caption(){

 currentPage().objects.push({
  type:"caption",
  text:"Meanwhile...",
  x:10,
  y:75,
  w:35,
  h:12,
  r:0,
  s:1
 });

 render();

}

function sticker(){

 currentPage().objects.push({
  type:"sticker",
  text:"⭐",
  x:70,
  y:15,
  w:15,
  h:15,
  r:0,
  s:1
 });

 render();

}

function imagePick(){

 document.getElementById("file").click();

}

function addImage(e){

 let file=e.target.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=()=>{

  currentPage().objects.push({
   type:"image",
   src:reader.result,
   x:20,
   y:20,
   w:35,
   h:30,
   r:0,
   s:1
  });

  render();

 };

 reader.readAsDataURL(file);

 e.target.value="";

}

function save(){

 localStorage.setItem(
  "ComicStudioProject",
  JSON.stringify(project)
 );

 alert("Comic saved on this phone!");

}

function load(){

 let data=localStorage.getItem("ComicStudioProject");

 if(!data){

  alert("No saved comic found.");

  return;

 }

 try{

  project=JSON.parse(data);

  render();

  alert("Comic loaded!");

 }catch(e){

  alert("Could not load comic.");

 }

}

function clearPage(){

 if(confirm("Clear this page?")){

  currentPage().panels=[];
  currentPage().objects=[];

  render();

 }

}

function exportPNG(){

 let p=currentPage();

 let canvas=document.createElement("canvas");

 canvas.width=1200;
 canvas.height=800;

 let ctx=canvas.getContext("2d");

 ctx.fillStyle=p.bg;
 ctx.fillRect(0,0,1200,800);

 p.panels.forEach(x=>{

  ctx.strokeStyle="#111";
  ctx.lineWidth=6;

  ctx.strokeRect(
   x.x/100*1200,
   x.y/100*800,
   x.w/100*1200,
   x.h/100*800
  );

 });

 let images=p.objects.filter(x=>x.type==="image");

 let remaining=images.length;

 function finish(){

  if(remaining>0)return;

  let link=document.createElement("a");

  link.download="my-comic.png";

  link.href=canvas.toDataURL("image/png");

  link.click();

 }

 p.objects.forEach(x=>{

  let X=x.x/100*1200;
  let Y=x.y/100*800;
  let W=x.w/100*1200;
  let H=x.h/100*800;

  if(x.type==="image"){

   let img=new Image();

   img.onload=()=>{

    ctx.drawImage(img,X,Y,W,H);

    remaining--;

    finish();

   };

   img.src=x.src;

  }else{

   ctx.fillStyle=
    x.type==="caption" ? "#ffe66d" : "#ffffff";

   ctx.strokeStyle="#111";

   ctx.lineWidth=4;

   ctx.fillRect(X,Y,W,H);

   ctx.strokeRect(X,Y,W,H);

   ctx.fillStyle="#111";

   ctx.font="bold 28px Arial";

   ctx.textAlign="center";

   ctx.textBaseline="middle";

   ctx.fillText(
    x.text,
    X+W/2,
    Y+H/2,
    W-15
   );

  }

 });

 finish();

}

render();

</script>

</body>
  </html>
