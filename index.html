<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0f17">
<title>Comic Studio Ultimate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span>🎨</span>
    <div>
      <strong>Comic Studio</strong>
      <small>ULTIMATE</small>
    </div>
  </div>

  <div class="top-actions">
    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>
    <button id="saveBtn">💾</button>
    <button id="fullscreenBtn">⛶</button>
  </div>
</header>
<main class="app">

<section class="workspace">

<div class="toolbar">

<button class="tool active" data-tool="select">↖️<span>Select</span></button>
<button class="tool" data-tool="pen">✏️<span>Pen</span></button>
<button class="tool" data-tool="marker">🖊️<span>Marker</span></button>
<button class="tool" data-tool="eraser">🧽<span>Eraser</span></button>
<button class="tool" data-tool="line">╱<span>Line</span></button>
<button class="tool" data-tool="shape">◯<span>Shape</span></button>
<button class="tool" data-tool="fill">🪣<span>Fill</span></button>
<button class="tool" data-tool="text">T<span>Text</span></button>
<button class="tool" data-tool="speech">💬<span>Speech</span></button>
<button class="tool" data-tool="thought">💭<span>Thought</span></button>
<button class="tool" data-tool="caption">📝<span>Caption</span></button>
<button class="tool" data-tool="sticker">⭐<span>Sticker</span></button>
<button class="tool" data-tool="panel">▣<span>Panel</span></button>
<button class="tool" data-tool="image">🖼️<span>Image</span></button>

</div>

<div class="canvas-area" id="canvasArea">
<div class="canvas-wrapper" id="canvasWrapper">

<canvas id="comicCanvas"></canvas>
<canvas id="animationCanvas"></canvas>

<div id="gridGuide" class="guide grid-guide"></div>
<div id="rulerGuide" class="guide ruler-guide"></div>
<div id="perspectiveGuide" class="guide perspective-guide"></div>

</div>
</div>

<div class="bottom-tools">

<div class="tool-option">
<label>Size</label>
<input type="range" id="brushSize" min="1" max="80" value="5">
<span id="brushSizeValue">5</span>
</div>

<div class="tool-option">
<label>Color</label>
<input type="color" id="colorPicker" value="#000000">
</div>

<div class="tool-option">
<label>Zoom</label>
<input type="range" id="zoomRange" min="25" max="300" value="100">
<span id="zoomValue">100%</span>
</div>

</div>

  </section>
  <aside class="side-panel">

<section class="panel-section">
<h3>📁 Project</h3>

<div class="button-grid">
<button id="newProjectBtn">➕ New</button>
<button id="duplicatePageBtn">📄 Duplicate</button>
<button id="deletePageBtn">🗑️ Delete</button>
<button id="exportProjectBtn">📦 Export</button>
<button id="importProjectBtn">📥 Import</button>
</div>

<input type="file" id="projectFileInput" accept=".json" hidden>
</section>

<section class="panel-section">
<h3>📚 Pages</h3>
<div id="pageList" class="page-list"></div>
</section>

<section class="panel-section">
<h3>▣ Panel Layout</h3>

<div class="button-grid">
<button data-layout="1">1 Panel</button>
<button data-layout="2">2 Panels</button>
<button data-layout="4">4 Panels</button>
<button data-layout="6">6 Panels</button>
</div>
</section>

<section class="panel-section">
<h3>🎨 Background</h3>

<div class="button-grid">
<button id="whiteBackgroundBtn">⬜ White</button>
<button id="blackBackgroundBtn">⬛ Black</button>
<button id="transparentBackgroundBtn">◻️ Clear</button>
</div>
</section>

<section class="panel-section">
<h3>📐 Guides</h3>

<div class="button-grid">
<button id="gridBtn">Grid</button>
<button id="rulerBtn">Ruler</button>
<button id="perspectiveBtn">Perspective</button>
</div>
</section>

<section class="panel-section inspector">
<h3>⚙️ Inspector</h3>

<div class="input-row">
<label>X</label>
<input type="number" id="objectX" value="0">
</div>

<div class="input-row">
<label>Y</label>
<input type="number" id="objectY" value="0">
</div>

<div class="input-row">
<label>Width</label>
<input type="number" id="objectWidth" value="100">
</div>

<div class="input-row">
<label>Height</label>
<input type="number" id="objectHeight" value="100">
</div>

<div class="input-row">
<label>Scale</label>
<input type="number" id="objectScale" value="1" step="0.1">
</div>

<div class="input-row">
<label>Rotation</label>
<input type="number" id="objectRotation" value="0">
</div>

<button id="applyTransformBtn" class="wide-btn">
Apply Transform
</button>

<div class="button-grid">
<button id="bringFrontBtn">⬆️ Front</button>
<button id="sendBackBtn">⬇️ Back</button>
<button id="duplicateObjectBtn">📑 Copy</button>
<button id="deleteObjectBtn">🗑️ Delete</button>
</div>

</section>

</aside>

  </main>
  <nav class="bottom-nav">

<button class="nav-item active" data-mode="comic">
<span>📖</span><small>Comic</small>
</button>

<button class="nav-item" data-mode="draw">
<span>✏️</span><small>Draw</small>
</button>

<button class="nav-item" data-mode="animate">
<span>🎞️</span><small>Animate</small>
</button>

<button class="nav-item" data-mode="3d">
<span>🧊</span><small>3D</small>
</button>

<button class="nav-item" data-mode="ideas">
<span>💡</span><small>Ideas</small>
</button>

<button class="nav-item" data-mode="export">
<span>📤</span><small>Export</small>
</button>

</nav>

<section id="animationPanel" class="feature-panel hidden">
<h2>🎞️ 2D Animation</h2>

<div class="animation-controls">
<button id="addFrameBtn">➕ Frame</button>
<button id="copyFrameBtn">📋 Copy</button>
<button id="deleteFrameBtn">🗑️ Delete</button>
<button id="playAnimationBtn">▶️ Play</button>
<button id="stopAnimationBtn">⏹️ Stop</button>

<label>FPS
<input type="number" id="fpsInput" value="12" min="1" max="60">
</label>

<label>
<input type="checkbox" id="loopAnimation"> Loop
</label>

<label>
<input type="checkbox" id="onionSkin"> Onion Skin
</label>
</div>

<div id="timeline" class="timeline"></div>
</section>

<section id="subtitlePanel" class="feature-panel hidden">
<h2>💬 Subtitles</h2>

<textarea id="subtitleText"
placeholder="Enter dialogue or narration..."></textarea>

<div class="two-column">
<input type="number" id="subtitleStart" value="0" step="0.1">
<input type="number" id="subtitleEnd" value="3" step="0.1">
</div>

<select id="subtitleLanguage">
<option>English</option>
<option>Yoruba</option>
<option>French</option>
</select>

<button id="addSubtitleBtn" class="wide-btn">
➕ Add Subtitle
</button>

<div id="subtitleList"></div>
</section>

<section id="audioPanel" class="feature-panel hidden">
<h2>🎙️ Voice & Audio</h2>

<button id="recordAudioBtn">🔴 Record Voice</button>
<button id="stopRecordingBtn">⏹️ Stop</button>

<label class="audio-import">
📥 Import Audio
<input type="file" id="audioInput" accept="audio/*" hidden>
</label>

<div id="audioTracks"></div>
</section>

<section id="characterPanel" class="feature-panel hidden">
<h2>🧑 Character Creator</h2>

<div id="characterPreview">
<div id="characterHair">💇</div>
<div id="characterHead">🙂</div>
<div id="characterBody">👕</div>
<div id="characterLegs">👖</div>
<div id="characterShoes">👟</div>
</div>

<select id="characterHeadSelect">
<option value="🙂">🙂</option>
<option value="😀">😀</option>
<option value="😎">😎</option>
<option value="😈">😈</option>
</select>

<select id="characterHairSelect">
<option value="💇">💇</option>
<option value="🧑‍🦱">🧑‍🦱</option>
<option value="🧑‍🦰">🧑‍🦰</option>
<option value="🧑‍🦲">🧑‍🦲</option>
</select>

<select id="characterBodySelect">
<option value="👕">👕</option>
<option value="🥋">🥋</option>
<option value="🦺">🦺</option>
<option value="🧥">🧥</option>
</select>

<button id="saveCharacterBtn" class="wide-btn">
⭐ Save Character
</button>

<div id="characterLibrary"></div>
</section>

<section id="threeDPanel" class="feature-panel hidden">
<h2>🧊 Lightweight 3D</h2>

<button id="addCubeBtn">🧊 Cube</button>
<button id="addSphereBtn">⚪ Sphere</button>
<button id="addCharacter3DBtn">🧑 Character</button>
<button id="lowPolyBtn">⚡ Low Poly</button>

<div id="threeDViewport">
<div id="threeDObject"></div>
</div>
</section>

<section id="ideaPanel" class="feature-panel hidden">
<h2>💡 Comic Idea Generator</h2>

<select id="ideaGenre">
<option>Superhero</option>
<option>Fantasy</option>
<option>Science Fiction</option>
<option>Comedy</option>
<option>Adventure</option>
<option>Horror</option>
<option>School</option>
<option>Afrofuturism</option>
</select>

<select id="ideaMood">
<option>Epic</option>
<option>Funny</option>
<option>Dark</option>
<option>Heartwarming</option>
<option>Mysterious</option>
<option>Action-packed</option>
</select>

<button id="generateIdeaBtn" class="wide-btn">
✨ Generate Comic Idea
</button>

<div id="ideaResult"></div>
</section>

<section id="exportPanel" class="feature-panel hidden">
<h2>📤 Export</h2>

<button id="exportPngBtn">🖼️ Export PNG</button>
<button id="exportJsonBtn">📦 Export Project</button>
<button id="exportAnimationBtn">🎞️ Export Animation</button>
</section>

<input type="file" id="imageInput" accept="image/*" hidden>

<div id="toast" class="toast">Ready!</div>

<script src="app.js"></script>
<script src="drawing.js"></script>
<script src="animation.js"></script>
<script src="audio.js"></script>
<script src="characters.js"></script>
<script src="3d.js"></script>

</body>
  </html>
